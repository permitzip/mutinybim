version: 2
# Cap open version-update pull requests so the tracker stays readable.
# Security updates are on separately and are not counted here.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["@types/*", "@typescript-eslint/*", "eslint", "jest", "jest-*", "typescript", "tsx", "esbuild"]
  - package-ecosystem: npm
    directory: /services/bim-authority
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /services/bim-authority
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
